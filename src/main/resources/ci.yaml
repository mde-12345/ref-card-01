name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ref-card-01

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build
      - name: Build image
        run: docker build -f src/main/resources/Dockerfile -t $IMAGE_NAME:latest .

      # Test: start the container and check that the app responds
      - name: Test image
        run: |
          docker run -d --name app -p 8080:8080 $IMAGE_NAME:latest
          curl -f --retry 10 --retry-all-errors --retry-delay 3 http://localhost:8080
          docker rm -f app

      # Deploy (only on push to main)
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push $IMAGE_NAME:latest
